<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Call Report</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --fg: #1b1a23; --muted: #6b6a78; --line: #e4e2ec; --accent: #3525cd;
      --ok: #15803d; --ok-bg: #e7f6ec; --bad: #c0392b; --bad-bg: #fbeceb; --warn: #b45309; --warn-bg: #fdf0dd;
      --grey: #6b6a78; --grey-bg: #efeef4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16151c; --panel: #1f1e27; --fg: #ecebf2; --muted: #a2a0b0; --line: #322f3c; --accent: #a99bff;
        --ok: #4ade80; --ok-bg: #16301f; --bad: #f87171; --bad-bg: #351b1b; --warn: #fbbf24; --warn-bg: #352917;
        --grey: #a2a0b0; --grey-bg: #27262f; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16151c; --panel: #1f1e27; --fg: #ecebf2; --muted: #a2a0b0; --line: #322f3c; --accent: #a99bff;
      --ok: #4ade80; --ok-bg: #16301f; --bad: #f87171; --bad-bg: #351b1b; --warn: #fbbf24; --warn-bg: #352917;
      --grey: #a2a0b0; --grey-bg: #27262f; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 64px; display: flex; flex-direction: column; gap: 26px; }
    .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    h1 { font-size: 27px; margin: 4px 0 0; font-weight: 700; }
    .lede { color: var(--muted); margin: 6px 0 0; }
    .lede b { color: var(--fg); font-variant-numeric: tabular-nums; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .agent { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
    .agent .f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .agent .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .agent .v { font-weight: 600; }
    .agent .wide { grid-column: 1 / -1; } .agent .wide .v { font-weight: 400; color: var(--fg); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
    .tile .n { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .tile.good .n { color: var(--ok); } .tile.bad .n { color: var(--bad); }
    .tile .l { font-weight: 600; } .tile .s { font-size: 12px; color: var(--muted); }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .bars { display: flex; flex-direction: column; gap: 10px; }
    .bar { display: grid; grid-template-columns: minmax(130px, 190px) 1fr auto; align-items: center; gap: 12px; }
    .bar .bl { min-width: 0; }
    .bar .bt { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; height: 16px; overflow: hidden; }
    .bar .bf { height: 100%; border-radius: 999px; transition: width .3s ease; }
    .bar .bv { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: right; }
    .listhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .listhead .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    select { font: inherit; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
    .twrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
    thead th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td.name { font-weight: 600; } td.said { color: var(--muted); min-width: 240px; } .mono { font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.name .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    td.demo { white-space: nowrap; color: var(--muted); } td.demo.has { color: var(--ok); font-weight: 600; }
    .play { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: 13px; white-space: nowrap; }
    .play:hover { border-color: var(--accent); } .play.on { background: var(--accent); color: #fff; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .c-interested { color: var(--ok); background: var(--ok-bg); } .c-not_interested { color: var(--bad); background: var(--bad-bg); }
    .c-maybe { color: var(--warn); background: var(--warn-bg); } .c-not_reached { color: var(--grey); background: var(--grey-bg); }
    .f-interested { background: var(--ok); } .f-not_interested { background: var(--bad); } .f-maybe { background: var(--warn); } .f-not_reached { background: var(--grey); }
    .booked { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 7px; }
    .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .btn { font: inherit; cursor: pointer; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
    .foot { font-size: 12px; color: var(--muted); }
    .state { padding: 60px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 480px) { .bar { grid-template-columns: 1fr auto; } .bar .bt { grid-column: 1 / -1; order: 3; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="eyebrow">AI voice agent · Call report</div>
      <button class="btn" id="refresh" hidden>Refresh</button>
    </div>
    <div id="state" class="state">Loading report…</div>
    <div id="report" hidden>
      <div style="display:flex; flex-direction:column; gap:26px;">
        <header>
          <h1 id="title">—</h1>
          <p class="lede" id="lede">—</p>
        </header>
        <section class="card agent" id="agent" aria-label="Agent details"></section>
        <section class="tiles" id="tiles" aria-label="Summary"></section>
        <section>
          <h2>How the calls went</h2>
          <div class="bars card" id="bars"></div>
        </section>
        <section>
          <div class="listhead">
            <h2 style="margin:0">Every call</h2>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="c" id="count">—</span>
              <select id="filter" aria-label="Filter by result">
                <option value="">All results</option>
                <option value="interested">Interested (yes)</option>
                <option value="not_interested">Not interested (no)</option>
                <option value="maybe">Answered, no clear answer</option>
                <option value="not_reached">Not reached</option>
              </select>
            </div>
          </div>
          <audio id="player" controls preload="none" hidden style="width:100%; margin-bottom:12px;"></audio>
          <div class="twrap">
            <table>
              <thead><tr><th>Lead</th><th>Phone</th><th>Result</th><th>Demo booked</th><th>Talk</th><th>Recording</th><th>What they said</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <p class="foot" id="foot">—</p>
      </div>
    </div>
  </div>

  <script>
    var ORDER = ['interested', 'maybe', 'not_interested', 'not_reached'];
    var qs = new URLSearchParams(location.search);
    var AGENT = qs.get('agent');
    var CAMPAIGN = qs.get('campaign');
    var TOKEN = qs.get('token') || '';
    var FILTER = '';
    var DATA = null;

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function esc(x) { return x == null ? '—' : String(x); }
    function fmtTalk(s) { s = Number(s) || 0; if (!s) return '—'; return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    function fmtWhen(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return '—'; } }

    function apiUrl(suffix) {
      var base = CAMPAIGN ? '/dashboard/api/campaigns/' + encodeURIComponent(CAMPAIGN)
                          : '/dashboard/api/agents/' + encodeURIComponent(AGENT);
      return base + suffix + (TOKEN ? (suffix.indexOf('?') < 0 ? '?' : '&') + 'token=' + encodeURIComponent(TOKEN) : '');
    }

    function showState(msg) { var s = document.getElementById('state'); s.textContent = msg; s.hidden = false; document.getElementById('report').hidden = true; }

    function render(d) {
      DATA = d;
      document.getElementById('state').hidden = true;
      document.getElementById('report').hidden = false;
      document.getElementById('refresh').hidden = false;

      var a = d.agent || {}, s = d.summary;
      document.getElementById('title').textContent = d.title || a.name || 'Call report';
      document.getElementById('lede').innerHTML = 'This agent made <b>' + s.total + '</b> calls. <b>' + s.answered +
        '</b> answered, <b>' + s.interested + '</b> said yes' + (s.booked ? ', and <b>' + s.booked + '</b> booked a demo' : '') + '.';

      var agent = document.getElementById('agent');
      agent.replaceChildren();
      var fields = [['Agent', a.name], ['Language', a.language], ['Voice', a.voice], ['Style', a.style]];
      fields.forEach(function (f) {
        var box = el('div', 'f'); box.append(el('span', 'k', f[0]), el('span', 'v', esc(f[1]))); agent.appendChild(box);
      });
      if (a.purpose) { var w = el('div', 'f wide'); w.append(el('span', 'k', 'What it does'), el('span', 'v', a.purpose)); agent.appendChild(w); }

      var tiles = document.getElementById('tiles');
      tiles.replaceChildren();
      [['', s.total, 'Calls made', ''], ['', s.answered, 'Answered', pct(s.answered, s.total) + '% of calls'],
       ['good', s.interested, 'Interested', 'said yes'], ['bad', s.not_interested, 'Not interested', 'said no']]
        .forEach(function (t) {
          var tile = el('div', 'tile' + (t[0] ? ' ' + t[0] : ''));
          tile.append(el('span', 'n', String(t[1])), el('span', 'l', t[2]), el('span', 's', t[3])); tiles.appendChild(tile);
        });

      var bars = document.getElementById('bars');
      bars.replaceChildren();
      var max = Math.max(s.interested, s.maybe, s.not_interested, s.not_reached, 1);
      var label = { interested: 'Interested (yes)', maybe: 'Answered, no clear answer', not_interested: 'Not interested (no)', not_reached: 'Not reached' };
      ORDER.forEach(function (cat) {
        var row = el('div', 'bar'); var n = s[cat] || 0;
        var fill = el('div', 'bf f-' + cat); fill.style.width = (n / max * 100) + '%';
        var track = el('div', 'bt'); track.appendChild(fill);
        row.append(el('div', 'bl', label[cat]), track, el('div', 'bv', String(n))); bars.appendChild(row);
      });

      drawRows();
      document.getElementById('foot').textContent = 'Live from your campaign · updated ' + new Date(d.generated_at).toLocaleString();
    }

    function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

    function drawRows() {
      var tbody = document.getElementById('rows');
      var calls = DATA.calls.filter(function (c) { return !FILTER || c.category === FILTER; });
      tbody.replaceChildren.apply(tbody, calls.map(function (c) {
        var tr = el('tr');
        var nameCell = el('td', 'name');
        nameCell.appendChild(el('div', null, esc(c.name)));
        if (c.at) nameCell.appendChild(el('div', 'sub', 'Called ' + fmtWhen(c.at)));
        var resCell = el('td'); resCell.appendChild(el('span', 'pill c-' + c.category, c.category_label));
        var demoCell = el('td', 'demo' + (c.demo_at ? ' has' : ''), c.demo_at ? fmtWhen(c.demo_at) : '—');
        var recCell = el('td');
        if (c.recording) {
          var btn = el('button', 'play', '▶ Play');
          btn.addEventListener('click', function () { playRecording(c.recording, btn); });
          recCell.appendChild(btn);
        } else { recCell.textContent = '—'; }
        tr.append(nameCell, el('td', 'mono', esc(c.phone)), resCell, demoCell,
          el('td', 'mono', fmtTalk(c.talk_seconds)), recCell, el('td', 'said', c.said || '—'));
        return tr;
      }));
      document.getElementById('count').textContent = FILTER ? calls.length + ' of ' + DATA.calls.length : calls.length + ' calls';
    }

    async function load() {
      if (!AGENT && !CAMPAIGN) { showState('No report selected. Add ?agent=<id> or ?campaign=<id> to the link.'); return; }
      try {
        var r = await fetch(apiUrl('/report'), { credentials: 'same-origin' });
        if (r.status === 403) { showState('This report link is not valid.'); return; }
        if (r.status === 404) { showState('Agent not found.'); return; }
        if (!r.ok) { showState('Could not load the report (' + r.status + ').'); return; }
        render(await r.json());
      } catch (e) { showState('Could not reach the server. Check your connection.'); }
    }

    var playingBtn = null;
    function playRecording(url, btn) {
      var player = document.getElementById('player');
      if (playingBtn) playingBtn.classList.remove('on');
      playingBtn = btn; btn.classList.add('on');
      player.src = url; player.hidden = false;
      player.play().catch(function () {});
      player.scrollIntoView({ block: 'nearest' });
    }

    document.getElementById('filter').addEventListener('change', function (e) { FILTER = e.target.value; if (DATA) drawRows(); });
    document.getElementById('refresh').addEventListener('click', load);
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
