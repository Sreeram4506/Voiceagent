<style>
*,:after,:before{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{overscroll-behavior:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c8c5d0;border-radius:3px}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 20;font-size:18px;line-height:1;vertical-align:middle}
.icon-sm{font-size:16px}
.icon-lg{font-size:22px}
.hidden{display:none!important}
.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(255,255,255,0.7)}
.toast{position:fixed;bottom:24px;right:24px;z-index:200;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:320px}
.toast.show{opacity:1;transform:none}
.modal-bg{position:fixed;inset:0;background:rgba(27,26,35,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.nav-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;color:#46454f;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap}
.nav-link:hover{background:#e8e6ff;color:#1b0587}
.nav-link.active{background:#3525cd;color:#fff}
.nav-link.active .material-symbols-outlined{color:#fff}
.kpi-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(53,37,205,0.06),0 1px 3px rgba(0,0,0,0.04);transition:box-shadow .2s}
.kpi-card:hover{box-shadow:0 8px 24px rgba(53,37,205,0.12)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:#3525cd;color:#fff;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary:hover{background:#2a1db5;transform:translateY(-1px)}
.btn-primary:active{transform:none}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:#e8e6ff;color:#3525cd;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-secondary:hover{background:#d8d5ff}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:transparent;color:#46454f;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #c8c5d0;transition:all .15s}
.btn-ghost:hover{background:#f3f2fc;border-color:#3525cd;color:#3525cd}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em}
.badge-green{background:#dcfce7;color:#166534}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-orange{background:#fed7aa;color:#9a3412}
.badge-red{background:#fecaca;color:#991b1b}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-purple{background:#ede9fe;color:#6d28d9}
.input{width:100%;padding:9px 12px;border:1px solid #c8c5d0;border-radius:8px;font-size:13px;background:#fff;color:#1b1a23;outline:none;transition:border-color .15s}
.input:focus{border-color:#3525cd;box-shadow:0 0 0 3px rgba(53,37,205,.1)}
.textarea{width:100%;padding:10px 12px;border:1px solid #c8c5d0;border-radius:8px;font-size:13px;background:#fff;color:#1b1a23;outline:none;resize:vertical;transition:border-color .15s;font-family:inherit}
.textarea:focus{border-color:#3525cd;box-shadow:0 0 0 3px rgba(53,37,205,.1)}
.select{width:100%;padding:9px 12px;border:1px solid #c8c5d0;border-radius:8px;font-size:13px;background:#fff;color:#1b1a23;outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2346454f'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 10px center;background-size:16px}
.select:focus{border-color:#3525cd;box-shadow:0 0 0 3px rgba(53,37,205,.1)}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:#79767d;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid #e4e1f5}
.table td{padding:12px 14px;font-size:13px;border-bottom:1px solid #f3f2fc}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr:hover td{background:#fafbff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid #e4e1f5;background:#f3f2fc;cursor:pointer;transition:all .15s}
.chip:hover,.chip.selected{background:#3525cd;color:#fff;border-color:#3525cd}
.wizard-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:#79767d;cursor:pointer}
.wizard-step.done .step-num{background:#005338;color:#fff}
.wizard-step.active .step-num{background:#3525cd;color:#fff}
.step-num{width:24px;height:24px;border-radius:50%;border:2px solid #c8c5d0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .2s}
.call-card{background:#fff;border-radius:16px;padding:16px;border:1px solid #e4e1f5;transition:all .2s;cursor:pointer}
.call-card:hover{border-color:#3525cd;box-shadow:0 4px 20px rgba(53,37,205,0.1)}
.call-card.selected{border-color:#3525cd;box-shadow:0 0 0 2px rgba(53,37,205,.2)}
.pulse-ring{width:8px;height:8px;border-radius:50%;position:relative;display:inline-block}
.pulse-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid;animation:pulse-ring 1.5s ease infinite;opacity:0}
@keyframes pulse-ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.pulse-green{background:#22c55e}.pulse-green::after{border-color:#22c55e}
.pulse-blue{background:#3b82f6}.pulse-blue::after{border-color:#3b82f6}
.pulse-orange{background:#f97316}.pulse-orange::after{border-color:#f97316}
.pulse-gray{background:#94a3b8}
.bar-chart-bar{transition:height .5s cubic-bezier(.4,0,.2,1)}
.donut-seg{transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.sidebar-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#79767d;padding:12px 12px 4px}
.range-track{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#e4e1f5;outline:none}
.range-track::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#3525cd;cursor:pointer;box-shadow:0 2px 6px rgba(53,37,205,.3)}

/* ═══════════════════════════════════════════════════════════
   PHONE UI / DIALER ENCLOSURE & CONTROLS
   ═══════════════════════════════════════════════════════════ */
.phone-case {
  width: 370px;
  max-width: 100%;
  height: 720px;
  background: #090d16;
  border-radius: 46px;
  padding: 10px;
  box-shadow: 0 30px 70px -15px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 2px rgba(255,255,255,0.12);
  position: relative;
  display: flex;
  flex-direction: column;
  transition: all 0.3s ease;
}
.phone-screen {
  flex: 1;
  background: #020617;
  border-radius: 38px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid rgba(255,255,255,0.05);
}
.phone-notch {
  width: 120px;
  height: 26px;
  background: #090d16;
  border-radius: 14px;
  margin: 6px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 20;
  box-shadow: inset 0 -1px 2px rgba(0,0,0,0.6);
}
.dial-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  cursor: pointer;
}
.dial-btn:hover { background: #334155; transform: scale(1.06); border-color: rgba(255,255,255,0.15); }
.dial-btn:active { background: #475569; transform: scale(0.92); }
.dial-btn .digit { font-size: 22px; font-weight: 600; color: #f8fafc; line-height: 1; }
.dial-btn .sub { font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; color: #94a3b8; margin-top: 2px; }

/* In-Call Equalizer Waves */
.eq-container { display: flex; align-items: center; gap: 3.5px; height: 28px; }
.eq-bar {
  width: 3.5px;
  border-radius: 3px;
  background: #10b981;
  animation: eq-bounce 1s ease-in-out infinite alternate;
}
@keyframes eq-bounce {
  0% { height: 4px; opacity: 0.4; }
  100% { height: 26px; opacity: 1; }
}
.eq-bar:nth-child(1) { animation-delay: 0.1s; height: 8px; }
.eq-bar:nth-child(2) { animation-delay: 0.4s; height: 20px; }
.eq-bar:nth-child(3) { animation-delay: 0.2s; height: 26px; }
.eq-bar:nth-child(4) { animation-delay: 0.5s; height: 14px; }
.eq-bar:nth-child(5) { animation-delay: 0.3s; height: 18px; }

</style>

<body class="bg-surface font-sans text-on-surface">

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed left-0 top-0 h-screen w-60 bg-white border-r border-surface-container-high z-50 flex flex-col overflow-hidden">
  <div class="h-14 px-4 flex items-center gap-3 border-b border-surface-container-high">

<!-- HEADER -->
<header class="fixed top-0 left-60 right-0 h-14 bg-white/80 backdrop-blur-sm border-b border-surface-container-high z-40 flex items-center justify-between px-5">

<!-- MAIN -->
<main class="pl-60 pt-14 min-h-screen">
  <div id="view" class="p-5"></div>
</main>

<!-- FLOATING PHONE DIALER BUTTON -->
<button id="floatingDialerBtn" onclick="openPhoneDialer()" title="Open Phone Dialer" class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
  <span class="material-symbols-outlined text-[26px]">dialpad</span>

<div id="modal" class="modal-bg hidden" onclick="closeModal(event)"></div>

<script>
// ═══════════════════════════════════════════════════════════
// AUTH CHECK — redirect to login if not authenticated
// ═══════════════════════════════════════════════════════════
(async function checkAuth() {
  try {
    const res = await fetch('/dashboard/api/auth/me', {credentials: 'same-origin'});
    if (res.status === 401) {
      location.href = '/login?next=' + encodeURIComponent(location.pathname + location.hash);
      return;
    }
    const me = await res.json();
    // Populate sidebar user info
    const initials = (me.name || me.email || '?')[0].toUpperCase();
    const av = document.getElementById('userAvatar');
    const un = document.getElementById('userName');
    const tn = document.getElementById('tenantName');
    if (av) av.textContent = initials;
    if (un) un.textContent = me.name || me.email;
    if (tn) tn.textContent = me.tenant_name || ('Tenant #' + me.tenant_id);
    window._currentUser = me;
  } catch(e) {
    console.warn('Auth check failed:', e);
  }
})();

async function doLogout() {
  try {
    await fetch('/dashboard/api/auth/logout', {method:'POST', credentials:'same-origin'});
  } catch(e) {}
  location.href = '/login';
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION CONFIG
// ═══════════════════════════════════════════════════════════
const NAV = [
  {label:"Operations",items:[
    {id:"dashboard",icon:"grid_view",title:"Dashboard"},
    {id:"dialer",icon:"dialpad",title:"Phone Dialer"},
    {id:"live-calls",icon:"phone_in_talk",title:"Live Calls"},
    {id:"appointments",icon:"calendar_month",title:"Appointments"},
  ]},
  {label:"Campaigns",items:[
    {id:"all-campaigns",icon:"campaign",title:"All Campaigns"},
    {id:"create-campaign",icon:"add_circle",title:"Create Campaign"},
    {id:"contact-lists",icon:"contacts",title:"Contact Lists"},
    {id:"call-history",icon:"history",title:"Call History"},
  ]},
  {label:"AI Studio",items:[
    {id:"employees",icon:"groups",title:"Employees"},
    {id:"agent-studio",icon:"record_voice_over",title:"Voice Agent Studio"},
  ]},
  {label:"Settings",items:[
    {id:"team",icon:"badge",title:"Team"},
    {id:"settings",icon:"settings",title:"Settings"},
  ]},
];

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const api = async (path, opts={}) => {
  try {
    const res = await fetch('/dashboard' + path, {credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opts});
    if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.hash); return {}; }
    return await res.json();
  } catch(e) { return {error: e.message}; }
};
const toast = (msg, ok=true) => {
  const t = $('toast'); t.textContent = msg;
  t.style.background = ok ? '#005338' : '#ba1a1a'; t.style.color = '#fff';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
};
const fmtDur = s => { s = Number(s||0); return Math.floor(s/60)+'m '+(s%60)+'s'; };
const fmtTime = iso => { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };
const fmtDate = iso => { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusColor = s => ({dialing:'badge-blue',connected:'badge-green',completed:'badge-gray',no_answer:'badge-orange',busy:'badge-orange',failed:'badge-red'}[s]||'badge-gray');
const campaignColor = s => ({running:'badge-green',paused:'badge-orange',draft:'badge-gray',completed:'badge-blue',scheduled:'badge-purple'}[s]||'badge-gray');

// ═══════════════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════════════
const route = () => location.hash.replace('#','') || 'dashboard';
const go = r => { location.hash = r; };

function buildNav() {
  const nav = $('nav');
  nav.innerHTML = NAV.map(section => `
    <div class="sidebar-section-label">${section.label}</div>
    ${section.items.map(item => `
      <a href="#${item.id}" data-route="${item.id}" class="nav-link">
        <span class="material-symbols-outlined">${item.icon}</span>
        ${item.title}
      </a>
    `).join('')}
  `).join('');
}

function setActiveNav(r) {
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('active', a.dataset.route === r);
  });
  const titles = {dashboard:'Dashboard',dialer:'Phone Dialer','live-calls':'Live Calls',appointments:'Appointments','all-campaigns':'All Campaigns','create-campaign':'Create Campaign','contact-lists':'Contact Lists','call-history':'Call History',employees:'Employees','agent-studio':'Voice Agent Studio',team:'Team & Permissions',settings:'Settings'};
  $('crumbs').textContent = titles[r] || r;
}

function closeModal(e) {
  if(e.target === $('modal')) { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; }
}

function showModal(html) {
  $('modal').innerHTML = `<div onclick="event.stopPropagation()">${html}</div>`;
  $('modal').classList.remove('hidden');
}

function hideModal() { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; }

// ═══════════════════════════════════════════════════════════
// DASHBOARD (Screen 1)
// ═══════════════════════════════════════════════════════════
async function renderDashboard() {
  $('view').innerHTML = `<div class="text-center py-16 text-on-surface-variant">Loading dashboard…</div>`;
  const data = await api('/api/overview');
  if(data.error) { $('view').innerHTML = `<div class="text-red-500 p-4">Error: ${esc(data.error)}</div>`; return; }

  const k = data.kpis || {};
  const trend = data.trend || [];
  const hourly = data.hourly || [];
  const outcomes = data.outcomes || {};
  const campaigns = data.campaigns || [];
  const pipeline = data.pipeline || {};

  // Build bar chart
  const maxBar = Math.max(...hourly, 1);
  const hourlyBars = hourly.map((v,i) => `
    <div class="flex flex-col items-center gap-1" style="width:14px">

              ${trend.length>1 ? `<polyline points="${pts}" fill="none" stroke="#3525cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
              ${trend.map((d,i)=>`<circle cx="${Math.round(i*(tW/(trend.length-1)))}" cy="${Math.round(tH-(d.placed/maxTrend)*tH)}" r="3" fill="#3525cd"/>`).join('')}
            </svg>

          <div class="space-y-2">

async function pauseCampaign(id) {
  const r = await api(`/api/campaigns/${id}/pause`, {method:'POST'});
  if(!r.error) { toast('Campaign paused'); renderDashboard(); }
}
async function launchCampaign(id) {
  const r = await api(`/api/campaigns/${id}/launch`, {method:'POST'});
  if(!r.error) { toast('Campaign launched!'); renderDashboard(); }
}
async function pauseAll() {
  const r = await api('/api/pause-all', {method:'POST'});
  toast(r.ok ? 'All campaigns paused' : (r.error||'Error'), r.ok);
  renderDashboard();
}
async function resumeAll() {
  const r = await api('/api/resume-all', {method:'POST'});
  toast(r.ok ? 'Campaigns resumed' : (r.error||'Error'), r.ok);
  renderDashboard();
}

function _wizardGoStep(step, lists, agents) {
  if(step > _wizard.step) return; // can only go back
  _wCollect();
  _wizard.step = step;
  _renderWizard(lists, agents);
}
function _wizardPrev(lists, agents) { _wCollect(); _wizard.step = Math.max(1, _wizard.step-1); _renderWizard(lists, agents); }
function _wizardNext(lists, agents) {
  _wCollect();
  if(_wizard.step===1 && !_wizard.data.name.trim()) { toast('Campaign name is required', false); return; }
  _wizard.step = Math.min(6, _wizard.step+1);
  _renderWizard(lists, agents);
}

function _wCollect() {
  const s = _wizard.step; const d = _wizard.data;
  if(s===1) {
    d.name = $('wName')?.value||d.name;
    d.objective = $('wObjective')?.value||d.objective;
    d.language = $('wLang')?.value||d.language;
    d.region = $('wRegion')?.value||d.region;
  } else if(s===4) {
    d.greeting = $('wGreeting')?.value||d.greeting;
    const triggers = document.querySelectorAll('.wObjTrigger');
    const resps = document.querySelectorAll('.wObjResp');
    d.objections = Array.from(triggers).map((t,i) => ({trigger:t.value, response:resps[i]?.value||''}));
  } else if(s===5) {
    d.window_start = $('wWinStart')?.value||d.window_start;
    d.window_end = $('wWinEnd')?.value||d.window_end;
    d.concurrency = parseInt($('wConcurrency')?.value)||d.concurrency;
    d.max_retries = parseInt($('wRetries')?.value)||d.max_retries;
    d.retry_interval_hours = parseInt($('wRetryHours')?.value)||d.retry_interval_hours;
  }
}

function _wSelectList(id, name) { _wizard.data.contact_list_id = id; renderCreateCampaign(); }
function _wSelectAgent(id, name) { _wizard.data.employee_id = id; renderCreateCampaign(); }

function wAddObjection() {
  _wCollect();
  _wizard.data.objections.push({trigger:'',response:''});
  renderCreateCampaign();
}

async function wUploadFile(input) {
  const file = input.files[0]; if(!file) return;
  const $status = $('wUploadStatus');
  $status.textContent = 'Uploading…';
  const fd = new FormData(); fd.append('file', file);
  const res = await fetch('/dashboard/api/upload', {method:'POST', body:fd});
  const r = await res.json();
  if(r.error) { $status.textContent = '✗ ' + r.error; $status.style.color='#ba1a1a'; return; }
  $status.textContent = `✓ Uploaded ${r.added} contacts (${r.skipped} skipped)`;
  $status.style.color = '#005338';
  _wizard.data.contact_list_id = r.list_id;
}

async function _wizardSubmit() {
  _wCollect();
  const d = _wizard.data;
  if(!d.name.trim()) { toast('Campaign name required', false); return; }
  const isDraft = $('wSaveDraft')?.checked;
  const payload = {...d, status: isDraft ? 'draft' : 'draft', apply_to_leads: true};
  const r = await api('/api/campaigns', {method:'POST', body:JSON.stringify(payload)});
  if(r.error) { toast('Error: '+r.error, false); return; }
  if(!isDraft) {
    await api(`/api/campaigns/${r.id}/launch`, {method:'POST'});
    toast('Campaign launched! 🚀');
  } else {
    toast('Campaign saved as draft');
  }
  _wizard = {step:1,data:{name:'',objective:'Appointment Booking',language:'te',region:'',greeting:'',objections:[{trigger:'',response:''}],concurrency:40,window_start:'09:30',window_end:'18:30',max_retries:3,retry_interval_hours:2,contact_list_id:null,employee_id:null,apply_to_leads:true}};
  go('all-campaigns');
}

async function sendPlayground() {
  const input = $('pgInput'); if(!input) return;

  const pg = $('playground');
  pg.innerHTML += `<div class="ml-auto max-w-[80%] bg-primary text-white rounded-xl rounded-tr-sm px-3 py-2">${esc(msg)}</div>`;
  pg.scrollTop = pg.scrollHeight;

  const r = await api('/api/playground', {method:'POST', body:JSON.stringify({agent_id:_selectedAgent?.id||0, message:msg})});
  if(r.reply) {
    pg.innerHTML += `<div class="max-w-[80%] bg-surface-container-low rounded-xl rounded-tl-sm px-3 py-2">${esc(r.reply)}</div>`;
    if(r.booked) pg.innerHTML += `<div class="text-center text-[11px] text-tertiary font-semibold">✓ Appointment booked in playground</div>`;

  // Update header live count

  if(!_selectedCall && calls.length) _selectedCall = calls[0];

  const callCards = calls.map(c => {
    const isActive = c.status === 'connected' || c.status === 'dialing';
    const pulseClass = c.status==='connected'?'pulse-green':c.status==='dialing'?'pulse-blue':'pulse-gray';
    const isSelected = _selectedCall && _selectedCall.id === c.id;

    ? '<div class="text-center text-on-surface-variant py-8 text-[12px]">No transcript yet</div>'

async function uploadContacts(input) {
  const file = input.files[0]; if(!file) return;
  const fd = new FormData(); fd.append('file', file);
  const res = await fetch('/dashboard/api/upload', {method:'POST', body:fd});
  const r = await res.json();
  if(r.error) { toast('Upload failed: '+r.error, false); return; }
  toast(`Uploaded ${r.added} contacts!`);
  renderContactLists();
}

async function recallLead(id) {
  const r = await api(`/api/recall/${id}`, {method:'POST'});
  toast(r.dialed ? 'Call dispatched!' : (r.error||'Failed'), !r.error);
}

  if(!confirm('Delete this contact?')) return;
  const r = await api(`/api/lead/${id}`, {method:'DELETE'});
  toast(r.deleted ? 'Contact deleted' : (r.error||'Error'), !!r.deleted);
  renderContactLists();
}

let _activePhoneCall = null;
let _phoneTimerInterval = null;
let _phoneTranscriptInterval = null;

function _playDtmf(f1, f2) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.frequency.value = f1;
    osc2.frequency.value = f2;
    gain.gain.value = 0.05;
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc1.start();
    osc2.start();
    setTimeout(() => { osc1.stop(); osc2.stop(); ctx.close(); }, 90);
  } catch(e) {}
}

function _phonePress(digit, f1, f2) {
  if (f1 && f2) _playDtmf(f1, f2);
  const input = $('pPhone');
  if (!input) return;
  input.value = (input.value || '') + digit;
  input.focus();
}

function _phoneBackspace() {
  const input = $('pPhone');
  if (!input) return;
  input.value = input.value.slice(0, -1);
  input.focus();
}

function _onPhoneAgentChange() {
  const sel = $('pAgent');
  const preview = $('pGreetingPreview');
  const greetingInput = $('pGreetingVal');
  if (!sel) return;
  const empId = Number(sel.value);
  const emp = (_cachedEmployees || []).find(e => e.id === empId);
  if (emp) {
    const g = emp.greeting || `నమస్కారం అండి, నేను ${emp.name} మాట్లాడుతున్నాను. ఒక్క నిమిషం మాట్లాడగలరా?`;
    if (greetingInput) greetingInput.value = g;
    if (preview) preview.textContent = g;
    const langBadge = $('pAgentLang');
    if (langBadge) langBadge.textContent = (emp.language || 'TE').toUpperCase();
  }
}

function _setPhoneGreeting(type) {
  const preview = $('pGreetingPreview');
  const val = $('pGreetingVal');
  const sel = $('pAgent');
  const empId = Number(sel?.value);
  const emp = (_cachedEmployees || []).find(e => e.id === empId) || {name: 'సుమ'};
  let text = '';
  if (type === 'intro') {
    text = `నమస్కారం అండి, నేను ${emp.name} మాట్లాడుతున్నాను. ఒక్క నిమిషం మాట్లాడగలరా?`;
  } else if (type === 'appointment') {
    text = 'నమస్కారం అండి, మీ అపాయింట్‌మెంట్ మరియు సైట్ విజిట్ బుకింగ్ గురించి కాల్ చేసాను. ఏ సమయం అనుకూలంగా ఉంటుంది?';
  } else if (type === 'campaign') {
    text = 'హలో అండి, నేను క్యాంపెయిన్ టీమ్ నుండి మాట్లాడుతున్నాను. మీ విలువైన సపోర్ట్ గురించి మాట్లాడదామని కాల్ చేశాను.';
  } else if (type === 'english') {
    text = 'Hello! I am calling regarding your inquiry. Do you have a quick minute to speak?';
  } else if (type === 'clear') {
    text = '';
  }
  if (val) val.value = text;
  if (preview) preview.textContent = text || '(AI will open conversation dynamically)';
  const customBox = $('pCustomGreetingBox');
  if (customBox) customBox.classList.add('hidden');
}

function _toggleCustomGreeting() {
  const box = $('pCustomGreetingBox');
  if (!box) return;
  box.classList.toggle('hidden');
  if (!box.classList.contains('hidden')) {
    const ta = $('pCustomGreetingText');
    if (ta) {
      ta.value = $('pGreetingVal')?.value || '';
      ta.focus();
    }

}

function _saveCustomGreeting() {
  const ta = $('pCustomGreetingText');
  const val = $('pGreetingVal');
  const preview = $('pGreetingPreview');
  if (ta && val && preview) {
    val.value = ta.value.trim();
    preview.textContent = val.value || '(AI will open conversation dynamically)';
  }
  $('pCustomGreetingBox')?.classList.add('hidden');
}

async function _startPhoneCall() {
  const phone = $('pPhone')?.value?.trim();
  const name = $('pName')?.value?.trim() || null;
  const agentSel = $('pAgent');
  const employeeId = Number(agentSel?.value || (_cachedEmployees[0]?.id || 1));
  const mode = $('pMode')?.value || 'ai_agent';
  const greeting = $('pGreetingVal')?.value?.trim() || '';

  if (!phone || phone.replace(/\D/g, '').length < 10) {
    toast('Please enter a valid 10-digit phone number', false);
    return;
  }

  const btn = $('pCallBtn');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('opacity-75');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size:28px">progress_activity</span>';
  }

  const res = await api(`/api/employees/${employeeId}/single-call`, {
    method: 'POST',
    body: JSON.stringify({ phone, name, mode, greeting }),
  });

  if (!res.ok) {
    toast(res.error || 'Failed to place call', false);
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('opacity-75');
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:32px">call</span>';
    }
    return;
  }

  toast(`✓ Call dispatched to ${res.phone || phone}`);
  _activePhoneCall = {
    callId: res.call_id,
    phone: res.phone || phone,
    name: name || 'Caller',
    employeeId: employeeId,
    mode: mode,
    startTime: Date.now(),
  };

  // Switch to in-call view inside phone
  $('phoneDialerState')?.classList.add('hidden');
  const inCall = $('phoneInCallState');
  if (inCall) {
    inCall.classList.remove('hidden');
    $('pInCallName').textContent = name || 'Live Call';
    $('pInCallPhone').textContent = res.phone || phone;
    $('pInCallStatus').textContent = 'Dialing via Plivo...';
    $('pInCallTimer').textContent = '00:00';
    $('pInCallTranscript').innerHTML = `<div class="text-center text-[11px] text-slate-400 py-4">Connecting audio stream...</div>`;
  }

  // Notch pulse
  $('notchIndicator')?.classList.remove('hidden');

  // Start in-call timer
  let secs = 0;
  if (_phoneTimerInterval) clearInterval(_phoneTimerInterval);
  _phoneTimerInterval = setInterval(() => {
    secs++;
    const m = String(Math.floor(secs / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    const timerEl = $('pInCallTimer');
    if (timerEl) timerEl.textContent = `${m}:${s}`;
  }, 1000);

  // Poll transcript and call status
  if (_phoneTranscriptInterval) clearInterval(_phoneTranscriptInterval);
  _phoneTranscriptInterval = setInterval(async () => {
    if (!_activePhoneCall) return;
    try {
      const live = await api('/api/live-calls');
      const active = (live.calls || []).find(c => c.id === _activePhoneCall.callId);
      if (active) {
        const statusEl = $('pInCallStatus');
        if (statusEl) {
          statusEl.textContent = active.status === 'connected' ? 'Connected (AI Live)' : active.status.toUpperCase();
          statusEl.className = active.status === 'connected' ? 'text-emerald-400 text-[11px] font-semibold' : 'text-amber-400 text-[11px] font-semibold';
        }
        if (active.turns && active.turns.length > 0) {
          const transEl = $('pInCallTranscript');
          if (transEl) {
            transEl.innerHTML = active.turns.map(t => `
              <div class="flex gap-2 ${t.role === 'agent' ? '' : 'flex-row-reverse'} mb-2">
                <div class="w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-[9px] font-bold ${t.role === 'agent' ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-200'}">
                  ${t.role === 'agent' ? 'AI' : 'U'}
                </div>
                <div class="max-w-[82%] px-2.5 py-1.5 rounded-xl text-[11.5px] leading-snug ${t.role === 'agent' ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-emerald-950 text-emerald-100 border border-emerald-800/60'}">
                  ${esc(t.text)}
                </div>
              </div>
            `).join('');
            transEl.scrollTop = transEl.scrollHeight;
          }
        }
        if (active.status === 'completed' || active.status === 'failed') {
          _endPhoneCallView(`Call ${active.status}`);
        }
      }
    } catch(e) {}
  }, 2000);
}

function _endPhoneCallView(msg = 'Call Ended') {
  if (_phoneTimerInterval) { clearInterval(_phoneTimerInterval); _phoneTimerInterval = null; }
  if (_phoneTranscriptInterval) { clearInterval(_phoneTranscriptInterval); _phoneTranscriptInterval = null; }
  $('notchIndicator')?.classList.add('hidden');
  const statusEl = $('pInCallStatus');
  if (statusEl) statusEl.textContent = msg;
  setTimeout(() => {
    $('phoneInCallState')?.classList.add('hidden');
    $('phoneDialerState')?.classList.remove('hidden');
    const btn = $('pCallBtn');
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('opacity-75');
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:32px">call</span>';
    }
    _activePhoneCall = null;
  }, 1200);
}

async function _inCallHangup() {
  if (!_activePhoneCall) return;
  const cid = _activePhoneCall.callId;
  _endPhoneCallView('Ending Call...');
  try {
    await api(`/api/live-calls/${cid}/end`, { method: 'POST' });

}

async function _inCallBook() {
  if (!_activePhoneCall) return;
  const cid = _activePhoneCall.callId;

  if (!_activePhoneCall) return;

function onEcFileChange(input) {
  if (input.files[0]) _setEcFile(input.files[0].name);
}
function handleEcDrop(e) {
  const f = e.dataTransfer.files[0];
  if (f) { $('ecFile').files = e.dataTransfer.files; _setEcFile(f.name); }
}
function _setEcFile(name) {
  const el = $('ecFileName'); const nt = $('ecFileNameText');
  if (el && nt) { nt.textContent = name; el.classList.remove('hidden'); }
}

async function doExcelCampaign(employeeId) {
  const nameEl = $('ecName');
  const fileEl = $('ecFile');
  const btn = $('ecBtn');
  const campaignName = nameEl?.value?.trim() || 'Excel Campaign';
  const mode = $('ecMode')?.value || 'ai_agent';
  const greeting = $('ecGreeting')?.value?.trim() || '';

  if (!fileEl?.files[0]) { toast('Please select a file', false); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined icon-sm" style="animation:spin 1s linear infinite;display:inline-block">refresh</span> Uploading…';

  const fd = new FormData();
  fd.append('file', fileEl.files[0]);
  fd.append('campaign_name', campaignName);
  fd.append('mode', mode);
  fd.append('greeting', greeting);

  try {
    const res = await fetch(`/dashboard/api/employees/${employeeId}/excel-campaign`, {
      method: 'POST',
      credentials: 'same-origin',
      body: fd,
    });
    if (res.status === 401) { location.href = '/login'; return; }
    const r = await res.json();
    if (r.ok) {
      toast(`Campaign launched! ${r.added} contacts queued${r.skipped ? `, ${r.skipped} skipped` : ''}.`);
      hideModal();
      go('all-campaigns');
    } else {
      toast(r.error || 'Upload failed', false);
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined icon-sm">rocket_launch</span> Launch Campaign';
    }
  } catch (e) {
    toast('Upload error: ' + e.message, false);
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined icon-sm">rocket_launch</span> Launch Campaign';
  }
}

async function runSearch(q) {
  if(!q.trim()) { $('searchBox').classList.add('hidden'); return; }
  const data = await api('/api/search?q='+encodeURIComponent(q));
  const items = [
    ...(data.campaigns||[]).map(c=>`<div class="p-2 hover:bg-surface-container-low rounded-lg cursor-pointer" onclick="go('all-campaigns')"><span class="material-symbols-outlined icon-sm text-primary">campaign</span> ${esc(c.name)} <span class="badge badge-gray ml-1">${c.status}</span></div>`),
    ...(data.leads||[]).map(l=>`<div class="p-2 hover:bg-surface-container-low rounded-lg cursor-pointer" onclick="go('contact-lists')"><span class="material-symbols-outlined icon-sm text-secondary">person</span> ${esc(l.name||l.phone)}</div>`),
    ...(data.agents||[]).map(a=>`<div class="p-2 hover:bg-surface-container-low rounded-lg cursor-pointer" onclick="go('agent-studio')"><span class="material-symbols-outlined icon-sm text-tertiary">record_voice_over</span> ${esc(a.name)}</div>`),
  ];
  const sb = $('searchBox');
  sb.innerHTML = items.length ? items.join('') : '<div class="p-3 text-center text-on-surface-variant text-[12px]">No results</div>';
  sb.classList.remove('hidden');
}

async function updateLiveCount() {

// ═══════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════
let _currentView = null;

async function navigate() {
  const r = route();
  if(_currentView === r) return;
  _currentView = r;

  // Stop live calls refresh if leaving that view
  if(r !== 'live-calls' && _liveCallsRefresh) {
    clearInterval(_liveCallsRefresh);
    _liveCallsRefresh = null;
  }

  setActiveNav(r);
  window.scrollTo(0,0);

  switch(r) {
    case 'dashboard': return renderDashboard();
    case 'live-calls': return renderLiveCalls();
    case 'appointments': return renderAppointments();
    case 'all-campaigns': return renderAllCampaigns();
    case 'create-campaign': return renderCreateCampaign();
    case 'contact-lists': return renderContactLists();
    case 'call-history': return renderCallHistory();
    case 'employees': return renderEmployees();
    case 'dialer': return renderPhoneDialerView();
    case 'agent-studio': return renderAgentStudio();
    case 'team': return renderTeam();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  navigate();
  window.addEventListener('hashchange', () => { _currentView = null; navigate(); });
  // Force correct view on direct hash navigation (e.g. link from another page)
  if (location.hash && location.hash !== '#dashboard') { _currentView = null; navigate(); }

  // Global search
  const gs = $('globalSearch');
  if(gs) {
    gs.addEventListener('input', e => runSearch(e.target.value));
    document.addEventListener('click', e => {
      if(!gs.contains(e.target)) $('searchBox').classList.add('hidden');
    });
  }

  // Live count every 10s
  _liveCountTimer = setInterval(updateLiveCount, 10000);

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if((e.metaKey||e.ctrlKey) && e.key==='k') {
      e.preventDefault();
      $('globalSearch')?.focus();
    }
    if(e.key==='Escape') {
      $('searchBox')?.classList.add('hidden');
      hideModal();
    }
  });
});
