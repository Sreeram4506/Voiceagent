<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SUMA AI — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3525cd;
  --primary-dark:#2518a0;
  --bg:#0a0a14;
  --surface:#12121f;
  --surface2:#1a1a2e;
  --border:#2a2a45;
  --text:#e8e8ff;
  --text2:#9898cc;
  --error:#ff4d6d;
  --success:#00c896;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
/* Animated background gradient */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(53,37,205,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(0,104,122,0.12) 0%, transparent 60%);
  pointer-events:none;
}
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:48px 44px;
  width:100%;
  max-width:420px;
  box-shadow:0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(53,37,205,0.08);
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:36px;
}
.logo-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--primary),#6b55ff);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(53,37,205,0.4);
}
.logo-icon span{font-size:22px;color:#fff}
.logo-text h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em}
.logo-text p{font-size:0.75rem;color:var(--text2);margin-top:1px}
h2{font-size:1.1rem;font-weight:600;margin-bottom:6px}
.subtitle{font-size:0.85rem;color:var(--text2);margin-bottom:28px}
.field{margin-bottom:18px}
label{display:block;font-size:0.78rem;font-weight:500;color:var(--text2);margin-bottom:7px;letter-spacing:0.03em}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap span.material-symbols-outlined{
  position:absolute;left:14px;
  font-size:18px;color:var(--text2);
  pointer-events:none;
}
input{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:inherit;
  font-size:0.9rem;
  padding:12px 14px 12px 42px;
  border-radius:10px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,37,205,0.2)}
input::placeholder{color:rgba(152,152,204,0.4)}
.eye-btn{
  position:absolute;right:12px;
  background:none;border:none;
  cursor:pointer;padding:4px;
  color:var(--text2);
  display:flex;align-items:center;
  transition:color .2s;
}
.eye-btn:hover{color:var(--text)}
.eye-btn span{font-size:18px}
.btn{
  width:100%;
  background:linear-gradient(135deg,var(--primary),#5540f0);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:13px;
  font-family:inherit;
  font-size:0.95rem;
  font-weight:600;
  cursor:pointer;
  transition:opacity .2s,transform .1s;
  margin-top:8px;
  position:relative;
  overflow:hidden;
}
.btn:hover{opacity:0.92}
.btn:active{transform:scale(0.99)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn .spinner{
  display:none;
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .6s linear infinite;
  margin:0 auto;
}
.btn.loading .btn-label{display:none}
.btn.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  display:none;
  background:rgba(255,77,109,0.12);
  border:1px solid rgba(255,77,109,0.3);
  color:var(--error);
  border-radius:8px;
  padding:10px 14px;
  font-size:0.82rem;
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.error-box.hidden{display:none!important}
.error-box span.material-symbols-outlined{font-size:16px;flex-shrink:0}
.hint{
  text-align:center;
  font-size:0.75rem;
  color:var(--text2);
  margin-top:24px;
}
.hint a{color:var(--primary);text-decoration:none}
.hint a:hover{text-decoration:underline}
.divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:0.75rem;color:var(--text2)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <span class="material-symbols-outlined">smart_toy</span>
    </div>
    <div class="logo-text">
      <h1>SUMA AI</h1>
      <p>Voice Agent Platform</p>
    </div>
  </div>

  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to your tenant dashboard</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <span class="material-symbols-outlined">mail</span>
        <input id="email" type="email" name="email" placeholder="admin@suma.ai" autocomplete="email" required/>
      </div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="material-symbols-outlined">lock</span>
        <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        <button type="button" class="eye-btn" id="eye" title="Toggle password visibility">
          <span class="material-symbols-outlined" id="eye-icon">visibility</span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn" id="submit-btn">
      <span class="btn-label">Sign in</span>
      <div class="spinner"></div>
    </button>

    <div class="error-box hidden" id="err">
      <span class="material-symbols-outlined">error</span>
      <span id="err-msg">Invalid email or password.</span>
    </div>
  </form>

  <div class="hint">
    Default: <strong>admin@suma.ai</strong> / <strong>suma2026</strong>
  </div>
</div>

<script>
const form = document.getElementById('form');
const btn = document.getElementById('submit-btn');
const errBox = document.getElementById('err');
const errMsg = document.getElementById('err-msg');
const eyeBtn = document.getElementById('eye');
const eyeIcon = document.getElementById('eye-icon');
const passwordInput = document.getElementById('password');

eyeBtn.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  eyeIcon.textContent = show ? 'visibility_off' : 'visibility';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.classList.add('hidden');
  btn.classList.add('loading');
  btn.disabled = true;

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/dashboard/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({email, password}),
    });
    if (res.ok) {
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/dashboard/';
    } else {
      const data = await res.json().catch(() => ({}));
      errMsg.textContent = data.detail || 'Invalid email or password.';
      errBox.classList.remove('hidden');
    }
  } catch (err) {
    errMsg.textContent = 'Network error. Please try again.';
    errBox.classList.remove('hidden');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
